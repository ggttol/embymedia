theme: dark

default_2fa_method: totp

server:
  address: tcp://0.0.0.0:9091

log:
  level: info
  format: json


authentication_backend:
  password_reset:
    disable: true
  file:
    path: /config/users_database.yml
    watch: false

access_control:
  default_policy: deny
  rules:
    - domain: auth.gaotao.cc
      policy: bypass
    - domain: dsh.gaotao.cc
      policy: two_factor

session:
  cookies:
    - domain: gaotao.cc
      authelia_url: https://auth.gaotao.cc
      default_redirection_url: https://dsh.gaotao.cc
      same_site: strict
      inactivity: 15m
      expiration: 8h
      remember_me: 7d

storage:
  local:
    path: /var/lib/authelia/db.sqlite3

notifier:
  filesystem:
    filename: /var/lib/authelia/notification.txt

telemetry:
  metrics:
    enabled: false
