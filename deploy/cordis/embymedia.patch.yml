- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    thinking: enabled
    reasoningEffort: high

- id: llm-pi-ai
  config:
    providers:
      minimax-cn:
        apiKeyEnv: MINIMAX_CN_API_KEY
        models:
          - id: MiniMax-M3

- id: session-telemetry-otel
  disabled: true

- id: message-feedback
  disabled: true

- id: ui-message-feedback
  disabled: true

- id: agent-presets
  config:
    default: emby-operator
    includeShippedRoot: false
    includeUserRoot: false
    roots:
      - path: !!js process.env.EMBYMEDIA_PRESET_ROOT
        trust: system

- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    launchUrlFile: /run/embymedia/dsh-launch-url
    surfaceContext: false
    trustedHosts: ['dsh.gaotao.cc', 'gaotao.cc']

- id: connection
  config:
    trustedHosts: ['dsh.gaotao.cc', 'gaotao.cc']
    cookieMaxAgeDays: 3650

- id: approval
  config:
    policy: never

- id: permission
  config:
    defaultPreset: workspace-write
    presets:
      workspace-write:
        sandbox: workspace-write
        approval: never
        name: Workspace Write
        description: Write in the managed workspace without approval prompts.
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: Danger Full Access
        description: Full file access without approval prompts.

- insert:
    - id: embymedia-operations
      name: '@embymedia/dsh-operations'
