name: V2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: make install-web
      - name: Typecheck, test, and build Linux release
        run: make check test build-linux
        env:
          EMBYMEDIA_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
      - name: Build container from source
        run: docker build --tag embymedia-v2:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: embymedia-v2-linux-amd64
          path: |
            bin/embymedia-linux-amd64
            bin/embymedia-linux-amd64.sha256
          if-no-files-found: error
